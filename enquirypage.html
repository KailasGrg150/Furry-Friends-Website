<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Furry Friends</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>

<body>

<header class="header">
    <div class="logo-section">
        <img src="Images/furry.png" class="logo">
        <h2>Furry Friends</h2>
    </div>

    <nav class="nav-menu">
        <div class="dropdown">
            <button class="dropbtn">Support Us</button>
            <div class="dropdown-content">
                <a href="supportpage.html">Understand our mission</a>
            </div>
        </div>

        <div class="dropdown">
            <button class="dropbtn">Galleries</button>
            <div class="dropdown-content">
                <a href="gallerypage.html">Our dogs</a>
            </div>
        </div>

        <div class="dropdown">
            <button class="dropbtn">Services</button>
            <div class="dropdown-content">
                <a href="enquirypage.html">Enquiry</a>
            </div>
        </div>

        <div class="dropdown">
            <button class="dropbtn">Contact</button>
            <div class="dropdown-content">
                <a href="contactspage.html">Contact us</a>
            </div>
        </div>
    </nav>
</header>


<section class="section">

    <div class="text-box">
        <h2>Enquiry Form</h2>
        <p>
            Please fill in the form below and our team will respond within 7 days.
            We aim to provide helpful and timely support for all enquiries.
        </p>
    </div>

    <div class="image-box">

        <form class="form">

            <label>First Name:</label>
            <input type="text" required>

            <label>Last Name:</label>
            <input type="text" required>

            <label>Email Address:</label>
            <input type="email" required>

            <label>Your Enquiry:</label>
            <textarea placeholder="Type here..." required minlength="10" maxlength="65"></textarea>

            <label class="checkbox">
                <input type="checkbox" required>
                I consent to my personal details being stored and used in compliance with GDPR regulations.
            </label>

            <input type="submit" value="Submit">

        </form>

    </div>

</section>


<footer class="footer">
    <h2>Social Media</h2>

    <div class="socials">
        <a href="#" class="fa fa-facebook"></a>
        <a href="#" class="fa fa-twitter"></a>
        <a href="#" class="fa fa-youtube"></a>
        <a href="#" class="fa fa-instagram"></a>
    </div>
</footer>

</body>
</html>
